name: pii_leakage
version: 2.0.0
description: Detects personally identifiable information (PII) leakage using regex pattern matching, contextual analysis, and Claude LLM verification.
author: AI Compliance Team
framework: PII_LEAKAGE
category: Security
enabled: true
tags:
  - pii
  - privacy
  - data-leakage
  - sensitive-data
  - compliance
  - claude-default
dependencies: []
supported_models:
  - claude-3-5-sonnet
  - claude-3-haiku-20240307
  - claude-3-sonnet-20240229
  - gpt-4
min_platform_version: 1.0.0

config_schema:
  type: object
  properties:
    default_model:
      type: string
      default: "claude-3-5-sonnet"
      description: Default LLM judge model provider (Claude default)
    risk_threshold:
      type: number
      minimum: 0
      maximum: 100
      default: 70
      description: High PII leakage risk threshold
