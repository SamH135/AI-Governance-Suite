name: insecure_output
version: 2.0.0
description: Security risk evaluation plugin detecting dangerous outputs (code execution, SQLi, command execution, credentials, network exploit) via rule-based patterns and Claude LLM security analysis.
author: AI Compliance Team
framework: INSECURE_OUTPUT
category: Security
enabled: true
tags:
  - security
  - code-safety
  - malware
  - exploitation
  - claude-default
dependencies: []
supported_models:
  - claude-3-5-sonnet
  - claude-3-haiku-20240307
  - claude-3-sonnet-20240229
  - gpt-4
min_platform_version: 1.0.0

config_schema:
  type: object
  properties:
    default_model:
      type: string
      default: "claude-3-5-sonnet"
      description: Default LLM judge model provider (Claude default)
    risk_threshold:
      type: number
      minimum: 0
      maximum: 100
      default: 70
      description: High security risk threshold
