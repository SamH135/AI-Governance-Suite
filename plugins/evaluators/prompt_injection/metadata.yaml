name: prompt_injection
version: 2.0.0
description: Evaluates text for prompt injection attempts, system impersonation, instruction overrides, and jailbreak techniques using rule-based signatures and Claude LLM risk assessment.
author: AI Compliance Team
framework: PROMPT_INJECTION
category: Security
enabled: true
tags:
  - prompt-injection
  - security
  - llm01
  - jailbreak
  - adversarial
  - claude-default
dependencies: []
supported_models:
  - claude-3-5-sonnet
  - claude-3-haiku-20240307
  - claude-3-sonnet-20240229
  - gpt-4
min_platform_version: 1.0.0

config_schema:
  type: object
  properties:
    default_model:
      type: string
      default: "claude-3-5-sonnet"
      description: Default LLM judge model provider (Claude default)
    analyze_mode:
      type: string
      enum: ["prompt", "response"]
      default: "response"
      description: Mode to analyze input prompt vs model response
