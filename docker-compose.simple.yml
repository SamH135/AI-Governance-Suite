

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ai_compliance
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_compliance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-compliance-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-compliance-network

  # API Gateway (Python FastAPI)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=development
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/ai_compliance
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_HOURS=24
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - COMPLIANCE_SERVICE_URL=http://compliance-service:8000
      - PROMPTS_SERVICE_URL=http://prompt-service:8000
      - DOCUMENTS_SERVICE_URL=http://document-service:8000
      - TESTS_SERVICE_URL=http://test-service:8000
      - ANALYTICS_SERVICE_URL=http://analytics-service:8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./gateway:/app
      - ./shared:/app/shared
      - ./services:/app/services
    networks:
      - ai-compliance-network

  # Compliance Testing Service (eval engine — no Milvus/MinIO needed;
  # vector and document features degrade gracefully)
  compliance-service:
    build:
      context: .
      dockerfile: services/compliance/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - PYTHON_ENV=development
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/ai_compliance
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - ./plugins:/app/plugins
      - ./tests:/app/tests
    networks:
      - ai-compliance-network

  # Prompt Generation Service
  prompt-service:
    build:
      context: .
      dockerfile: services/prompts/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - PYTHON_ENV=development
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/ai_compliance
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - ai-compliance-network

  # Document Generation Service
  document-service:
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    ports:
      - "8003:8000"
    environment:
      - PYTHON_ENV=development
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/ai_compliance
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FILE_STORAGE_PATH=/app/storage
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - document_storage:/app/storage
    networks:
      - ai-compliance-network

  # Test Orchestration Service
  test-service:
    build:
      context: .
      dockerfile: services/tests/Dockerfile
    ports:
      - "8004:8000"
    environment:
      - PYTHON_ENV=development
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/ai_compliance
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - ai-compliance-network

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    ports:
      - "8005:8000"
    environment:
      - PYTHON_ENV=development
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/ai_compliance
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - ai-compliance-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    depends_on:
      - gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ai-compliance-network

volumes:
  postgres_data:
  redis_data:
  document_storage:

networks:
  ai-compliance-network:
    driver: bridge