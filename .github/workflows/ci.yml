name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Compose files hard-require JWT_SECRET (":?"); CI has no secrets — dummy is fine.
  JWT_SECRET: ci-not-a-real-secret

jobs:
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.simple.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot lightweight stack
        run: docker compose -f docker-compose.simple.yml up -d --build
      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health/ && break
            sleep 5
          done
      - name: Run unit tests inside compliance container
        run: docker compose -f docker-compose.simple.yml exec -T compliance-service python -m pytest tests/unit/ -q
      - name: Run gateway tests inside gateway container
        run: |
          docker compose -f docker-compose.simple.yml exec -T gateway python -m pip install -q pytest
          docker compose -f docker-compose.simple.yml exec -T gateway python -m pytest /repo/tests/unit/test_gateway_proxy.py /repo/tests/unit/test_gateway_cors_order.py -q
      - name: Smoke-check core endpoints
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['token'])")
          curl -sf http://localhost:8000/api/compliance/evaluators/ -H "Authorization: Bearer $TOKEN"
          curl -sf http://localhost:8000/api/compliance/systems -H "Authorization: Bearer $TOKEN"
          curl -sf http://localhost:8000/api/compliance/coverage-matrix -H "Authorization: Bearer $TOKEN"
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.simple.yml down -v

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8 black isort mypy
      - name: Fatal lint (syntax errors, undefined names)
        run: flake8 services/ gateway/ shared/ plugins/ --select=E9,F63,F7,F82
      - name: Full style report (informational)
        continue-on-error: true
        run: flake8 services/ gateway/ shared/ plugins/ --count --statistics
      - name: Format/type check (informational)
        continue-on-error: true
        run: |
          black --check services/ gateway/ shared/ plugins/ || true
          isort --check-only services/ gateway/ shared/ plugins/ || true
          mypy services/ gateway/ || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --passWithNoTests
      - run: npm run build

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Python dependency audit (informational until baseline is clean)
        continue-on-error: true
        run: pip-audit -r services/requirements.txt -r gateway/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (informational until baseline is clean)
        continue-on-error: true
        run: cd frontend && npm audit --audit-level=high
